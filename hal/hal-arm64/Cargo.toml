# ============================================================================
# hal-arm64
#
# The ARM64 (AArch64) architecture implementation of every hal-core
# trait, per 01-HAL-Layer.md section 6. Mirrors hal-x86_64's structure
# exactly (see that crate's Cargo.toml for the general rationale shared
# by every hal-<arch> crate); this file only documents what differs.
#
# Key architectural differences from hal-x86_64, reflected throughout
# this crate:
#   - Privilege levels: EL0 (user) / EL1 (kernel) / EL2 (hypervisor,
#     this project's "Monitor" level) instead of Ring 3/0.
#   - Interrupt controller: GICv3/v4 instead of APIC/x2APIC.
#   - Timer: ARM Generic Timer instead of TSC/HPET.
#   - Boot: UEFI (same as x86_64, per section 3.5) OR Device Tree,
#     with ACPI preferred when a valid RSDP is present (section 10).
#   - IOMMU: SMMU instead of VT-d.
# ============================================================================

[package]
name        = "hal-arm64"
description = "ARM64 (AArch64) architecture implementation of the hal-core trait contracts"
edition.workspace    = true
version.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hal-core     = { path = "../hal-core" }
hal-manifest = { path = "../hal-manifest", default-features = false }
bitflags     = { workspace = true }

[dependencies.hal-direct]
path = "../hal-direct"
optional = true

[features]
default = []
hal-direct-support = ["dep:hal-direct"]

[package.metadata.hal]
target = "targets/aarch64-hal.json"